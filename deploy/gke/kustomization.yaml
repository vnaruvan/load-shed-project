apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../k8s
  - ingress.yaml
  - pod-monitoring.yaml
images:
  - name: load-shed-api
    newName: REGION-docker.pkg.dev/PROJECT_ID/load-shed/load-shed-api
    newTag: REPLACE_WITH_COMMIT
patches:
  - target:
      kind: Deployment
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
  - target:
      kind: Service
      name: load-shed-api
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          cloud.google.com/neg: '{"ingress": true}'
          cloud.google.com/backend-config: '{"ports": {"http": "load-shed-api"}}'
