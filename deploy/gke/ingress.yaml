apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: load-shed-api
  namespace: load-shed
spec:
  timeoutSec: 15
  connectionDraining:
    drainingTimeoutSec: 10
  healthCheck:
    type: HTTP
    requestPath: /healthz
    port: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: load-shed-api
  namespace: load-shed
  annotations:
    kubernetes.io/ingress.class: gce
spec:
  rules:
    - http:
        paths:
          - path: /healthz
            pathType: Exact
            backend:
              service: {name: load-shed-api, port: {number: 80}}
          - path: /work
            pathType: Exact
            backend:
              service: {name: load-shed-api, port: {number: 80}}
          - path: /client
            pathType: Exact
            backend:
              service: {name: load-shed-api, port: {number: 80}}
