apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata: {name: load-shed-threshold-alerts, namespace: monitoring, labels: {release: kube-prometheus-stack}}
spec:
  groups:
    - name: load-shed.thresholds
      rules:
        - alert: LoadShedBreakerOpen
          expr: load_shed_circuit_breaker_state == 1
          for: 2m
          labels: {severity: warning}
          annotations: {summary: "Circuit breaker continuously open for two minutes"}
        - alert: LoadShedHighClient5xxFraction
          expr: sum(rate(load_shed_http_requests_total{route="/client",status=~"5.."}[5m])) / sum(rate(load_shed_http_requests_total{route="/client"}[5m])) > 0.02 and sum(rate(load_shed_http_requests_total{route="/client"}[5m])) > 1
          for: 5m
          labels: {severity: critical}
          annotations: {summary: "Client 5xx fraction exceeds 2% above 1 rps"}
        - alert: LoadShedUpstreamP95High
          expr: histogram_quantile(0.95, sum by (le) (rate(load_shed_upstream_request_duration_seconds_bucket[5m]))) > 0.5
          for: 5m
          labels: {severity: warning}
          annotations: {summary: "Upstream p95 exceeds 500 ms"}
        - alert: LoadShedFractionHigh
          expr: sum(rate(load_shed_admission_requests_total{decision="shed"}[5m])) / sum(rate(load_shed_admission_requests_total{decision="offered"}[5m])) > 0.1
          for: 5m
          labels: {severity: warning}
          annotations: {summary: "More than 10% of offered work is shed"}
