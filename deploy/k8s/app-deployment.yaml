apiVersion: apps/v1
kind: Deployment
metadata: {name: load-shed-api, namespace: load-shed, labels: {app: load-shed-api}}
spec:
  replicas: 2
  selector: {matchLabels: {app: load-shed-api}}
  template:
    metadata: {labels: {app: load-shed-api}}
    spec:
      terminationGracePeriodSeconds: 20
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: api
          image: load-shed-api:local
          imagePullPolicy: Never
          env:
            - {name: UPSTREAM_BASE_URL, value: "http://load-shed-upstream"}
            - {name: MAX_INFLIGHT, value: "50"}
            - {name: LOW_PRIORITY_MAX_INFLIGHT, value: "35"}
            - {name: NORMAL_PRIORITY_MAX_INFLIGHT, value: "45"}
          ports: [{containerPort: 8080, name: http}]
          readinessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 2, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 10, periodSeconds: 10}
          lifecycle: {preStop: {exec: {command: ["sh", "-c", "sleep 5"]}}}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: ["ALL"]}}
          resources:
            requests: {cpu: 150m, memory: 128Mi}
            limits: {cpu: 600m, memory: 256Mi}
